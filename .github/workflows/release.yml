name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name vihsihtlihmiht visit_bar.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: >-
          gh release create $env:RELEASE_TAG dist/vihsihtlihmiht.exe
          --title "vihsihtlihmiht $env:RELEASE_TAG"
          --notes "Standalone Windows build — download vihsihtlihmiht.exe and double-click to start a 12-minute visit timer."

  # Runs after build-windows, which creates the release, and adds the Linux
  # binary to it. Kept as a separate job so the Windows build above is
  # untouched — if this one fails, the Windows release still ships.
  build-linux:
    needs: build-windows
    # Pinned, NOT ubuntu-latest. glibc is backward but not forward compatible:
    # a binary built on 24.04 (glibc 2.39) refuses to start on Ubuntu 22.04 /
    # Mint 21 with "GLIBC_2.38 not found". Building on the oldest supported
    # runner makes the binary run on that release and everything newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tkinter is present
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      - name: Build standalone binary
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name vihsihtlihmiht-linux visit_bar_linux.py
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: >-
          gh release upload "$RELEASE_TAG" dist/vihsihtlihmiht-linux
          --repo "$GITHUB_REPOSITORY" --clobber
