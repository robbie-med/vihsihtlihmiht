name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name vihsihtlihmiht visit_bar.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: >-
          gh release create $env:RELEASE_TAG dist/vihsihtlihmiht.exe
          --title "vihsihtlihmiht $env:RELEASE_TAG"
          --notes "Standalone Windows build — download vihsihtlihmiht.exe and double-click to start a 12-minute visit timer."
